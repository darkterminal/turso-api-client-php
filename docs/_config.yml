title: Turso Platform PHP SDK
tagline: Typed PHP client for the Turso Platform API
description: >-
  Turso Platform PHP SDK is a typed, PSR-18-friendly PHP client for the Turso
  Platform API. It covers users, auth, locations, organizations, members,
  invites, databases, groups, API tokens, audit logs, recovery, and standalone
  integrations for database upload and region resolution.
url: https://darkterminal.github.io
baseurl: /turso-api-client-php

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: pretty

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - _site
  - api-map.md
  - architecture.md
  - troubleshooting.md

defaults:
  - scope:
      path: "user-manual"
    values:
      layout: manual
